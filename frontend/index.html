<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stars Nova Web</title>
    <script>
        // Self-locating app root: derive the base URL from the address
        // the browser actually used, so the game works unchanged behind
        // any proxy, VPN, port-forward, or path prefix - with or
        // without a trailing slash - and with zero configuration.
        (function () {
            var p = window.location.pathname;
            if (/\.[A-Za-z0-9]+$/.test(p)) {
                // Served as an explicit file (e.g. .../index.html)
                p = p.replace(/[^/]*$/, '');
            } else if (p.charAt(p.length - 1) !== '/') {
                // Prefix without trailing slash (e.g. /proxy/9800)
                p += '/';
            }
            document.write('<base href="' + p + '">');
        })();
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23101020'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%237cb3ff'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%237cb3ff' stroke-width='1.5' opacity='0.5'/%3E%3Ccircle cx='25' cy='9' r='1.5' fill='%23ffcc66'/%3E%3Ccircle cx='7' cy='24' r='1' fill='%23ffffff'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="static/css/main.css?v=6">
    <link rel="stylesheet" href="static/css/stars-theme.css?v=5">
</head>
<body>
    <div id="app">
        <!-- Menu Bar - Classic Stars! style -->
        <div id="menu-bar"></div>

        <main>
            <!-- Game container - shown when game is active -->
            <div id="game-container" class="hidden">
                <!-- Left Column - 40% width panels -->
                <div id="left-column">
                    <!-- Empire Summary - compact info bar -->
                    <div id="empire-summary">
                        <div class="summary-section">
                            <span class="summary-label">Planets</span>
                            <span id="summary-planets" class="summary-value">0</span>
                        </div>
                        <div class="summary-section">
                            <span class="summary-label">Fleets</span>
                            <span id="summary-fleets" class="summary-value">0</span>
                        </div>
                        <div class="summary-section">
                            <span class="summary-label">Pop</span>
                            <span id="summary-population" class="summary-value">0</span>
                        </div>
                        <div class="summary-section resources">
                            <span class="summary-label">Resources</span>
                            <span id="summary-resources" class="summary-value">
                                <span class="res-ir" title="Ironium">0</span>
                                <span class="res-bo" title="Boranium">0</span>
                                <span class="res-ge" title="Germanium">0</span>
                            </span>
                        </div>
                    </div>

                    <!-- Star/Planet Panel -->
                    <div id="star-panel" class="panel hidden"></div>

                    <!-- Fleet Panel -->
                    <div id="fleet-panel" class="panel hidden"></div>

                    <!-- Production Queue Panel (optional, shown when planet selected) -->
                    <div id="production-panel" class="panel hidden"></div>
                </div>

                <!-- Scanner Pane - 60% width galaxy map -->
                <div id="scanner-pane">
                    <svg id="nebula-layer" class="nebula-svg"></svg>
                    <canvas id="galaxy-map"></canvas>
                </div>

                <!-- Message Panel - bottom of game area, full width -->
                <div id="message-panel" class="message-panel hidden"></div>
            </div>

            <!-- Menu container - shown when no game is active -->
            <div id="menu-container">
                <div class="menu-card">
                    <div class="menu-logo">
                        <h2>Stars Nova</h2>
                        <p>A 4X Strategy Game in Space</p>
                    </div>
                    <div class="menu-buttons">
                        <button id="menu-new-game" class="primary">New Game</button>
                        <button id="menu-continue">Continue</button>
                        <button id="menu-load-game">Load Game</button>
                        <button id="menu-settings">Settings</button>
                    </div>
                    <div class="menu-footer">
                        <p>Based on Stars! by Jeff Johnson and Jeff McBride</p>
                    </div>
                </div>
            </div>

            <!-- Floating Panels -->
            <!-- Design Panel -->
            <div id="design-panel" class="floating-panel hidden"></div>

            <!-- Battle Viewer -->
            <div id="battle-viewer" class="floating-panel hidden"></div>

            <!-- Race Designer Wizard -->
            <div id="race-wizard" class="floating-panel hidden"></div>

            <!-- Reports Panel -->
            <div id="reports-panel" class="floating-panel reports-panel hidden"></div>
        </main>

        <footer>
            <span id="status-bar">Ready</span>
            <span id="turn-indicator"></span>
            <span>Stars Nova Web v0.1.0</span>
        </footer>
    </div>

    <!-- Dialog overlay -->
    <div id="dialog-overlay" class="dialog-overlay hidden"></div>

    <!-- Scripts - load order matters -->
    <script src="static/js/api/client.js?v=5"></script>
    <script src="static/js/state/game-state.js?v=5"></script>
    <script src="static/js/views/nebula-designer.js?v=5"></script>
    <script src="static/js/views/nebula-svg.js?v=5"></script>
    <script src="static/js/views/galaxy-map.js?v=5"></script>
    <script src="static/js/views/panel-manager.js?v=5"></script>
    <script src="static/js/views/star-panel.js?v=5"></script>
    <script src="static/js/views/fleet-panel.js?v=5"></script>
    <script src="static/js/views/message-panel.js?v=5"></script>
    <script src="static/js/views/design-panel.js?v=5"></script>
    <script src="static/js/views/battle-viewer.js?v=5"></script>
    <script src="static/js/views/race-wizard.js?v=5"></script>
    <script src="static/js/views/reports.js?v=5"></script>
    <script src="static/js/views/menu-bar.js?v=7"></script>
    <script src="static/js/views/dialogs.js?v=5"></script>
    <script src="static/js/views/encyclopedia.js?v=7"></script>
    <script src="static/js/app.js?v=5"></script>
</body>
</html>
