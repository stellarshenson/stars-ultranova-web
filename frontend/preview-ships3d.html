<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ships3d render harness</title>
<style>
    body { margin: 0; background: #05070c; color: #cfd6df; font: 13px monospace; }
    #wrap { display: flex; gap: 12px; padding: 12px; align-items: flex-start; }
    .stack { display: flex; flex-direction: column; gap: 12px; }
    canvas { display: block; background: #05070c; border: 1px solid #1b2331; }
    #stats { background: #0b0f16; border: 1px solid #1b2331; padding: 12px 16px; min-width: 480px; line-height: 1.55; }
    #stats h2 { margin: 0 0 6px 0; font-size: 14px; color: #8fb5ff; }
    #stats .k { color: #6e7b8f; }
    #err { color: #ff7a6a; padding: 12px; white-space: pre-wrap; }
</style>
<script type="importmap">
{ "imports": { "three": "/frontend/vendor/three/build/three.module.js" } }
</script>
</head>
<body>
<div id="wrap">
    <canvas id="main"></canvas>
    <div class="stack" id="side" style="display:none">
        <canvas id="wire"></canvas>
        <div id="stats"></div>
    </div>
</div>
<div id="err"></div>
<script type="module">
// Render harness: loads a persisted assets/ships/<hull>.glb (never the
// generator - this proves the glb is self-contained), lights it with a
// three-point rig and renders at arbitrary resolution.
// Params: ?ship=destroyer&size=1024&proof=1&az=32&el=16
import * as THREE from 'three';
import { GLTFLoader } from '/frontend/vendor/three/examples/jsm/loaders/GLTFLoader.js';
import { OrbitControls } from '/frontend/vendor/three/examples/jsm/controls/OrbitControls.js';
import { RoomEnvironment } from '/frontend/vendor/three/examples/jsm/environments/RoomEnvironment.js';

window.PREVIEW_READY = false;
const params = new URLSearchParams(location.search);
const shipName = params.get('ship') || 'destroyer';
const size = parseInt(params.get('size') || '1024', 10);
const proof = params.get('proof') === '1';
const azDeg = parseFloat(params.get('az') || '32');
const elDeg = parseFloat(params.get('el') || '16');

const canvas = document.getElementById('main');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setSize(size, size, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070c);

// starfield backdrop (harness dressing, not part of the asset)
{
    let s = 12345;
    const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
    const pts = [];
    for (let i = 0; i < 900; i++) {
        const v = new THREE.Vector3(rnd() * 2 - 1, rnd() * 2 - 1, rnd() * 2 - 1).normalize().multiplyScalar(220);
        pts.push(v.x, v.y, v.z);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pts), 3));
    scene.add(new THREE.Points(geo, new THREE.PointsMaterial({ color: 0x9fb4d8, size: 0.35, sizeAttenuation: false })));
}

// three-point rig: warm key, cool fill, hard rim
const key = new THREE.DirectionalLight(0xfff0dc, 3.9);
key.position.set(6, 7, 5);
const fill = new THREE.DirectionalLight(0x8fb5ff, 1.0);
fill.position.set(-7, 1.5, 3);
const rim = new THREE.DirectionalLight(0xcfe2ff, 2.8);
rim.position.set(-2, 3.5, -8);
scene.add(key, fill, rim, new THREE.AmbientLight(0x1a2230, 1.0));

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.45;

const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 800);
const controls = new OrbitControls(camera, canvas);

const err = (m) => { document.getElementById('err').textContent = 'ERROR: ' + m; };

const url = `/assets/ships/${shipName}.glb`;
const resp = await fetch(url);
if (!resp.ok) { err(`fetch ${url} -> ${resp.status}`); throw new Error('glb fetch failed'); }
const buf = await resp.arrayBuffer();
const gltf = await new Promise((resolve, reject) => {
    new GLTFLoader().parse(buf, '/assets/ships/', resolve, reject);
});
const ship = gltf.scene;
scene.add(ship);

// stats from the loaded glb (not from any generator state)
let triangles = 0, vertices = 0, meshes = 0;
const matNames = new Set();
ship.traverse((o) => {
    if (!o.isMesh) return;
    meshes += 1;
    const p = o.geometry.attributes.position;
    vertices += p.count;
    triangles += o.geometry.index ? o.geometry.index.count / 3 : p.count / 3;
    matNames.add(o.material.name || '(unnamed)');
});

// frame the ship at a 3/4 hero angle
const sphere = new THREE.Box3().setFromObject(ship).getBoundingSphere(new THREE.Sphere());
const dist = (sphere.radius / Math.tan((camera.fov * Math.PI) / 360)) * parseFloat(params.get('fit') || '0.8');
const az = (azDeg * Math.PI) / 180, el = (elDeg * Math.PI) / 180;
camera.position.set(
    sphere.center.x + dist * Math.cos(el) * Math.sin(az),
    sphere.center.y + dist * Math.sin(el),
    sphere.center.z + dist * Math.cos(el) * Math.cos(az)
);
camera.lookAt(sphere.center);
controls.target.copy(sphere.center);
controls.update();

function render() { renderer.render(scene, camera); }
controls.addEventListener('change', render);
render();

// proof mode: wireframe view + stats readout beside the beauty render
if (proof) {
    document.getElementById('side').style.display = 'flex';
    const wireCanvas = document.getElementById('wire');
    const wireRenderer = new THREE.WebGLRenderer({ canvas: wireCanvas, antialias: true, preserveDrawingBuffer: true });
    const wireSize = Math.floor(size / 2);
    wireRenderer.setSize(wireSize, wireSize, false);
    const wireScene = new THREE.Scene();
    wireScene.background = new THREE.Color(0x070a10);
    const wireMat = new THREE.MeshBasicMaterial({ wireframe: true, color: 0x3fa9ff, transparent: true, opacity: 0.5 });
    ship.traverse((o) => { if (o.isMesh) wireScene.add(new THREE.Mesh(o.geometry, wireMat)); });
    wireRenderer.render(wireScene, camera);

    document.getElementById('stats').innerHTML = `
        <h2>ships3d pipeline proof - ${shipName}</h2>
        <div><span class="k">canonical asset:</span> assets/ships/${shipName}.glb (${(buf.byteLength / 1e6).toFixed(2)} MB, loaded cold by this harness)</div>
        <div><span class="k">triangles:</span> ${triangles.toLocaleString()} <span class="k">vertices:</span> ${vertices.toLocaleString()}</div>
        <div><span class="k">draw calls (meshes):</span> ${meshes} <span class="k">materials:</span> ${[...matNames].sort().join(', ')}</div>
        <div><span class="k">beauty render:</span> ${size} x ${size} <span class="k">wireframe:</span> ${wireSize} x ${wireSize}</div>
        <div><span class="k">renderer:</span> three.js r${THREE.REVISION} WebGL, ACES filmic, three-point rig + env probe</div>
        <div><span class="k">extras:</span> ${JSON.stringify(ship.userData && ship.userData.ship || gltf.scene.children[0] && gltf.scene.children[0].userData || {})}</div>`;
}

// arbitrary-resolution capture hook for tooling
window.captureShip = (w, h) => {
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    render();
    const data = canvas.toDataURL('image/png');
    renderer.setSize(size, size, false);
    camera.aspect = 1;
    camera.updateProjectionMatrix();
    render();
    return data;
};

window.SHIP_STATS = { ship: shipName, bytes: buf.byteLength, triangles, vertices, meshes, materials: [...matNames].sort(), three: THREE.REVISION };
window.PREVIEW_READY = true;
</script>
</body>
</html>
