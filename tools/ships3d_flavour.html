<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ships3d flavour gallery</title>
<style>
    body { margin: 0; background: #05070c; color: #cfd6df; font: 13px monospace; }
    #log { padding: 10px; white-space: pre-wrap; }
    canvas { display: none; }
</style>
<script type="importmap">
{ "imports": { "three": "/frontend/vendor/three/build/three.module.js" } }
</script>
</head>
<body>
<div id="log">rendering flavour incarnations...</div>
<canvas id="main"></canvas>
<script type="module">
// Flavour gallery driver (art directive 9): every hull record compiled at
// flavour 0.0 / 0.5 / 1.0 - same record, knob turned - and rendered to
// walkthrough/review/renders3d/flavour-<hull>-<f>.png via the save endpoint.
// Compiles live (the glb store holds the canonical flavour-0 assets only).
// Usage: /tools/ships3d_flavour.html?ship=all&px=384
import * as THREE from 'three';
import { RoomEnvironment } from '/frontend/vendor/three/examples/jsm/environments/RoomEnvironment.js';
import { compileShip } from '/frontend/js/ships3d/compiler.js';
import { loadDonorLibrary } from '/frontend/js/ships3d/donors.js';
import { SHIP_RECORDS, HULL_NAMES } from '/frontend/js/ships3d/records.js';

window.RENDER_DONE = null;
const log = (s) => { document.getElementById('log').textContent += '\n' + s; };
const params = new URLSearchParams(location.search);
const shipParam = params.get('ship') || 'all';
const px = parseInt(params.get('px') || '384', 10);
const ships = shipParam === 'all' ? HULL_NAMES : shipParam.split(',');
const FLAVOURS = [[0, '00'], [0.5, '05'], [1, '10']];

const canvas = document.getElementById('main');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
let donors = null;

function buildScene() {
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05070c);
    const key = new THREE.DirectionalLight(0xfff0dc, 3.9);
    key.position.set(6, 7, 5);
    const fill = new THREE.DirectionalLight(0x8fb5ff, 1.0);
    fill.position.set(-7, 1.5, 3);
    const rim = new THREE.DirectionalLight(0xcfe2ff, 2.8);
    rim.position.set(-2, 3.5, -8);
    scene.add(key, fill, rim, new THREE.AmbientLight(0x1a2230, 1.0));
    scene.environment = envTex;
    scene.environmentIntensity = 0.45;
    return scene;
}

function disposeGroup(group) {
    group.traverse((o) => {
        if (!o.isMesh) return;
        o.geometry.dispose();
        for (const m of Array.isArray(o.material) ? o.material : [o.material]) {
            for (const k of Object.keys(m)) if (m[k] && m[k].isTexture) m[k].dispose();
            m.dispose();
        }
    });
}

async function renderOne(shipName, flavour, slug) {
    const record = SHIP_RECORDS[shipName];
    const { group } = await compileShip(record, { flavour, donors, textureSize: 512 });
    const scene = buildScene();
    scene.add(group);
    const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 800);
    const sphere = new THREE.Box3().setFromObject(group).getBoundingSphere(new THREE.Sphere());
    const dist = (sphere.radius / Math.tan((camera.fov * Math.PI) / 360)) * 0.8;
    const az = (46 * Math.PI) / 180, el = (12 * Math.PI) / 180;
    camera.position.set(
        sphere.center.x + dist * Math.cos(el) * Math.sin(az),
        sphere.center.y + dist * Math.sin(el),
        sphere.center.z + dist * Math.cos(el) * Math.cos(az)
    );
    camera.lookAt(sphere.center);
    renderer.setSize(px, px, false);
    renderer.render(scene, camera);
    const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
    const res = await fetch(`/api/save-render?name=${slug}`, { method: 'POST', body: blob });
    const saved = await res.json();
    if (!saved.ok) throw new Error(`save-render failed for ${slug}`);
    disposeGroup(group);
    return saved.bytes;
}

const done = [];
try {
    donors = await loadDonorLibrary();
    log(`donor library: ${donors.size} parts`);
    for (const shipName of ships) {
        for (const [f, tag] of FLAVOURS) {
            const slug = `flavour-${shipName}-${tag}`;
            done.push({ slug, bytes: await renderOne(shipName, f, slug) });
            log(`rendered ${slug}`);
        }
    }
    window.RENDER_DONE = { ok: true, count: done.length, done };
    log('DONE');
} catch (err) {
    log('ERROR: ' + (err && err.message || err));
    window.RENDER_DONE = { ok: false, error: String(err && err.message || err), done };
}
</script>
</body>
</html>
